name: Generate & Deploy Portfolio

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check secrets are available
        run: |
          if [ -z "${{ secrets.JWT_TOKEN }}" ]; then echo "❌ JWT_TOKEN secret is empty or not set"; exit 1; fi
          if [ -z "${{ secrets.STUDENT_LOGIN }}" ]; then echo "❌ STUDENT_LOGIN secret is empty or not set"; exit 1; fi
          echo "✓ Secrets are present"

      - name: Run portfolio exporter
        env:
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
          STUDENT_LOGIN: ${{ secrets.STUDENT_LOGIN }}
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
        run: python fetch_01founders.py

      - name: Move HTML to docs/
        run: |
          mkdir -p docs
          mv *_01founders_portfolio.html docs/index.html

      - name: Commit and push generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin Main
          git reset --soft origin/Main
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update portfolio report"
          git push --force-with-lease origin Main
