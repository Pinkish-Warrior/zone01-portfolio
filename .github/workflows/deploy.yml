name: Generate & Deploy Portfolio

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create .env from secrets
        run: |
          echo "JWT_TOKEN=${{ secrets.JWT_TOKEN }}" >> .env
          echo "STUDENT_LOGIN=${{ secrets.STUDENT_LOGIN }}" >> .env
          echo "STUDENT_ID=${{ secrets.STUDENT_ID }}" >> .env

      - name: Run portfolio exporter
        run: python fetch_01founders.py

      - name: Move HTML to docs/
        run: |
          mkdir -p docs
          mv *_01founders_portfolio.html docs/index.html

      - name: Commit and push generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update portfolio report"
          git push
